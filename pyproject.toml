[project]
name = "anvil"
version = "0.2.0"
description = "A sandboxed, observable coding agent with provider fallback, a streaming API and an evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Akash Gupta" }]
dependencies = [
    "openai>=3.46,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings[yaml]>=2.16,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
]


[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TID"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess without shell is the point of the runner tool
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests"]
exclude = ["examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
